[project]
name = "evalgate"
version = "0.1.0"
description = "Statistical CI gate for agent evaluations: floors, paired regression tests, PR report"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rick Clark" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6",
]

[project.scripts]
evalgate = "evalgate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
